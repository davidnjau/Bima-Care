services:
  postgres:
    image: postgres:16-alpine
    container_name: bima-postgres
    # Default max_connections=100 is too low once you multiply 10+ services by HikariCP's
    # default pool size of 10 each (shared/service-commons/Database.kt) - genuinely exhausted
    # this in practice (13 services -> up to 130 possible connections), which silently
    # produces the same symptom as a hung service (requests time out waiting for a
    # connection that never frees up). Bumped well above what this fleet can currently demand.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bima}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bima}
      POSTGRES_DB: bima
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bima}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: bima-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Single-broker cluster: the default replication factor of 3 for internal topics
      # (__consumer_offsets, __transaction_state) can never be satisfied, which silently
      # breaks every consumer group forever (produce/fetch still work, only group
      # coordination hangs) - this went unnoticed until Phase 2 added the first real
      # Kafka consumers.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  minio:
    image: minio/minio:latest
    container_name: bima-minio
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bima}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bima-dev-only}
    ports:
      - "9000:9000"   # S3 API
      - "9091:9091"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  hapi-fhir-server:
    image: hapiproject/hapi:latest
    container_name: bima-hapi-fhir-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hapi_fhir_server
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bima}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bima}
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      HAPI_FHIR_FHIR_VERSION: R4
      HAPI_FHIR_ALLOW_EXTERNAL_REFERENCES: "true"
    ports:
      - "8094:8080"
    # First boot builds its Lucene search index + Hibernate schema - can genuinely take 1-2
    # minutes, hence the generous retries. /fhir/metadata returning a CapabilityStatement is
    # the real readiness signal, not just the port accepting connections.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/fhir/metadata >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: bima-keycloak
    # realm-export.json sets sslRequired: none - on Docker Desktop for Mac, host->container
    # traffic is routed through the VM's gateway IP, not 127.0.0.1, so Keycloak's default
    # sslRequired: external (which exempts loopback) rejects every plain-HTTP local dev
    # request with "HTTPS required".
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json

volumes:
  postgres-data:
  minio-data:
