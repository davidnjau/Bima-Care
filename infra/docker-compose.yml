services:
  postgres:
    image: postgres:16-alpine
    container_name: bima-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bima}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bima}
      POSTGRES_DB: bima
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bima}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: bima-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Single-broker cluster: the default replication factor of 3 for internal topics
      # (__consumer_offsets, __transaction_state) can never be satisfied, which silently
      # breaks every consumer group forever (produce/fetch still work, only group
      # coordination hangs) - this went unnoticed until Phase 2 added the first real
      # Kafka consumers.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: bima-keycloak
    # realm-export.json sets sslRequired: none - on Docker Desktop for Mac, host->container
    # traffic is routed through the VM's gateway IP, not 127.0.0.1, so Keycloak's default
    # sslRequired: external (which exempts loopback) rejects every plain-HTTP local dev
    # request with "HTTPS required".
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json

volumes:
  postgres-data:
