# Vue Router uses createWebHistory() (real paths like /admin/members, not #/admin/members),
# so a hard refresh or direct link on any client-side route needs the server to fall back to
# index.html rather than 404 - the SPA's own router then takes over and renders the route.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
