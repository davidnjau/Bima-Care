name: Reset Data (one-off)

# Manual-trigger only - never runs on push/PR. Intended to be deleted right after the one
# run it's needed for (see infra/deploy/README.md's git history if you need to resurrect
# this later for another full reset).
on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Truncate all business data, reset HAPI FHIR, clear MinIO documents
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "--- Truncating business tables ---"
            docker exec bima-postgres psql -U bima -d patient_service -c "TRUNCATE TABLE dependents, patients;"
            docker exec bima-postgres psql -U bima -d provider_service -c "TRUNCATE TABLE practitioners;"
            docker exec bima-postgres psql -U bima -d organization_service -c "TRUNCATE TABLE organizations;"
            docker exec bima-postgres psql -U bima -d eligibility_service -c "TRUNCATE TABLE coverages, policies;"
            docker exec bima-postgres psql -U bima -d claims_service -c "TRUNCATE TABLE claims;"
            docker exec bima-postgres psql -U bima -d encounter_service -c "TRUNCATE TABLE encounters;"
            docker exec bima-postgres psql -U bima -d document_service -c "TRUNCATE TABLE documents;"
            docker exec bima-postgres psql -U bima -d audit_service -c "TRUNCATE TABLE audit_events;"
            docker exec bima-postgres psql -U bima -d consent_service -c "TRUNCATE TABLE consents;"
            docker exec bima-postgres psql -U bima -d payments_service -c "TRUNCATE TABLE payments;"

            echo "--- Resetting the HAPI FHIR server's own database ---"
            # sync-service pushes Patient/Practitioner/Organization FHIR resources into this
            # standalone HAPI JPA server (see RegistrationSyncConsumer) - it has its own complex
            # internal schema (search-param indexes, history tables, etc.), so drop-and-recreate
            # is the safe way to fully reset it, same as HAPI would do against a brand-new DB.
            docker stop bima-hapi-fhir-server
            docker exec bima-postgres psql -U bima -d postgres -c "DROP DATABASE IF EXISTS hapi_fhir_server WITH (FORCE);"
            docker exec bima-postgres psql -U bima -d postgres -c "CREATE DATABASE hapi_fhir_server;"
            docker start bima-hapi-fhir-server

            echo "--- Clearing MinIO document bucket ---"
            cd ~/bima-care/infra
            MINIO_USER=$(grep '^MINIO_ROOT_USER=' .env | cut -d= -f2-)
            MINIO_PASS=$(grep '^MINIO_ROOT_PASSWORD=' .env | cut -d= -f2-)
            docker exec bima-minio mc alias set local http://localhost:9000 "$MINIO_USER" "$MINIO_PASS"
            docker exec bima-minio mc rm --recursive --force local/bima-documents/ || true

            echo "--- Reset complete ---"
