name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew ktlintCheck detekt

      - name: Build & test
        run: ./gradlew build

  build-images:
    name: Build & push ${{ matrix.service }} image
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - iam-service
          - patient-service
          - provider-service
          - organization-service
          - eligibility-service
          - encounter-service
          - claims-service
          - payments-service
          - audit-service
          - consent-service
          - document-service
          - fhir-gateway
          - sync-service
          - gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve Gradle module and Docker context
        id: resolve
        run: |
          if [ "${{ matrix.service }}" = "gateway" ]; then
            echo "module=:gateway" >> "$GITHUB_OUTPUT"
            echo "context=gateway" >> "$GITHUB_OUTPUT"
          else
            echo "module=:services:${{ matrix.service }}" >> "$GITHUB_OUTPUT"
            echo "context=services/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build shadow jar
        run: ./gradlew ${{ steps.resolve.outputs.module }}:shadowJar -x test -x detekt -x ktlintCheck

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.resolve.outputs.context }}
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/bima-care-${{ matrix.service }}:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/bima-care-${{ matrix.service }}:${{ github.sha }}

  build-web-image:
    name: Build & push web image
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          # These must be the SAME externally-reachable Keycloak/gateway URLs as the
          # PUBLIC_KEYCLOAK_ISSUER / PUBLIC_WEB_ORIGIN set in infra/.env on the VPS - see
          # infra/deploy/README.md. A mismatch here means every login silently 401s.
          build-args: |
            VITE_KEYCLOAK_URL=${{ secrets.PUBLIC_KEYCLOAK_URL }}
            VITE_API_BASE_URL=${{ secrets.PUBLIC_API_BASE_URL }}
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/bima-care-web:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/bima-care-web:${{ github.sha }}

  deploy:
    name: Deploy to VPS
    needs: [build-images, build-web-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Everything the VPS needs to run is generated or copied here, every deploy - the VPS
      # itself holds no persistent config of its own beyond what this step and the next one
      # write to it. Re-running this workflow is always safe: Docker/compose apply is
      # idempotent, and this file is fully overwritten from secrets each time.
      - name: Render infra/.env from secrets
        run: |
          # Keycloak's --hostname flag wants a bare hostname, not a URL - derived here
          # rather than adding a whole extra secret that has to be kept in sync with
          # PUBLIC_KEYCLOAK_URL by hand.
          KEYCLOAK_HOSTNAME=$(echo "${{ secrets.PUBLIC_KEYCLOAK_URL }}" | sed -E 's#^https?://##')
          cat > infra/.env <<EOF
          POSTGRES_USER=bima
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          KEYCLOAK_ADMIN_USER=admin
          KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_HOSTNAME=$KEYCLOAK_HOSTNAME
          CADDY_EMAIL=${{ secrets.CADDY_EMAIL }}
          MINIO_ROOT_USER=bima
          MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_BUCKET=bima-documents
          BIMA_GATEWAY_CLIENT_SECRET=${{ secrets.BIMA_GATEWAY_CLIENT_SECRET }}
          IAM_PROVISIONER_CLIENT_ID=bima-iam-provisioner
          IAM_PROVISIONER_CLIENT_SECRET=${{ secrets.IAM_PROVISIONER_CLIENT_SECRET }}
          PUBLIC_KEYCLOAK_ISSUER=${{ secrets.PUBLIC_KEYCLOAK_URL }}/realms/bima-care
          PUBLIC_WEB_ORIGIN=${{ secrets.PUBLIC_WEB_ORIGIN }}
          IMAGE_PREFIX=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/bima-care
          IMAGE_TAG=${{ github.sha }}
          DEMO_PROVIDER_IDENTITIES=${{ secrets.DEMO_PROVIDER_IDENTITIES }}
          DEMO_INSURER_IDENTITIES=${{ secrets.DEMO_INSURER_IDENTITIES }}
          EOF

      # Bundle into one archive rather than relying on scp-action's multi-source/directory
      # path handling - a single file sidesteps any ambiguity about whether relative
      # directory structure survives the copy.
      - name: Package infra config
        run: tar -czf infra-bundle.tar.gz infra/docker-compose.infra.yml infra/docker-compose.apps.yml infra/postgres infra/keycloak infra/caddy infra/.env

      - name: Copy bundle to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "infra-bundle.tar.gz"
          target: "~/bima-care"

      - name: Extract, install Docker if missing, bring up both compose layers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          # Default is 10m, which a cold first deploy (pulling ~19 images with nothing
          # cached yet) can genuinely exceed. Later deploys only pull changed layers and
          # will be much faster, but this needs enough headroom for the first one.
          command_timeout: 40m
          script: |
            set -euo pipefail
            mkdir -p ~/bima-care
            tar -xzf ~/bima-care/infra-bundle.tar.gz -C ~/bima-care
            rm ~/bima-care/infra-bundle.tar.gz
            if ! command -v docker >/dev/null 2>&1; then
              # get.docker.com's convenience script doesn't recognize AlmaLinux/Rocky even
              # though they're RHEL-compatible - fall back to Docker's own CentOS repo via
              # dnf for any RHEL-family distro, since that's what actually works there.
              if [ -f /etc/redhat-release ] || grep -qiE "almalinux|rocky|centos|rhel|fedora" /etc/os-release 2>/dev/null; then
                dnf -y install dnf-plugins-core
                dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
                dnf install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              else
                curl -fsSL https://get.docker.com | sh
              fi
              systemctl enable --now docker
            fi
            cd ~/bima-care/infra
            # Compose validates the full project graph (depends_on included) for every
            # subcommand, not just `up` - docker-compose.apps.yml's depends_on references
            # postgres/kafka/keycloak, which only exist in docker-compose.infra.yml, so BOTH
            # files must be passed together on every invocation, `pull` included.
            COMPOSE_FILES="-f docker-compose.infra.yml -f docker-compose.apps.yml"
            # Keycloak needs its own database before it can start. 01-create-databases.sql
            # only runs against a brand-new postgres-data volume, so on an already-provisioned
            # VPS it never fires - create it here instead, idempotently, so both a fresh VPS
            # and an existing one end up with it. POSTGRES_USER is always "bima" (see the
            # render step above) - reading it straight from the container avoids sourcing
            # the whole .env file, which would break on any secret containing shell metachars.
            docker compose --env-file .env $COMPOSE_FILES up -d postgres
            until docker exec bima-postgres pg_isready -U bima >/dev/null 2>&1; do sleep 2; done
            docker exec bima-postgres psql -U bima -tc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | grep -q 1 \
              || docker exec bima-postgres psql -U bima -c "CREATE DATABASE keycloak"
            # Member reimbursement claims (claim_type/documents/date_of_service, nullable
            # practitioner_id) - Exposed's SchemaUtils.create() never alters an existing table,
            # so these need to be applied by hand on an already-provisioned VPS. `IF EXISTS`/
            # `IF NOT EXISTS` make every statement a no-op on a fresh install too, where the
            # claims/encounters tables don't exist yet until each service's own first startup
            # creates them (already matching the new schema) - safe to run unconditionally.
            docker exec bima-postgres psql -U bima -d claims_service -c \
              "ALTER TABLE IF EXISTS claims ALTER COLUMN practitioner_id DROP NOT NULL;"
            docker exec bima-postgres psql -U bima -d claims_service -c \
              "ALTER TABLE IF EXISTS claims ADD COLUMN IF NOT EXISTS claim_type VARCHAR(32) NOT NULL DEFAULT 'PROVIDER_SUBMITTED';"
            docker exec bima-postgres psql -U bima -d claims_service -c \
              "ALTER TABLE IF EXISTS claims ADD COLUMN IF NOT EXISTS date_of_service DATE;"
            docker exec bima-postgres psql -U bima -d claims_service -c \
              "ALTER TABLE IF EXISTS claims ADD COLUMN IF NOT EXISTS claim_form_document_id UUID;"
            docker exec bima-postgres psql -U bima -d claims_service -c \
              "ALTER TABLE IF EXISTS claims ADD COLUMN IF NOT EXISTS itemized_receipt_document_id UUID;"
            docker exec bima-postgres psql -U bima -d claims_service -c \
              "ALTER TABLE IF EXISTS claims ADD COLUMN IF NOT EXISTS etr_document_id UUID;"
            docker exec bima-postgres psql -U bima -d encounter_service -c \
              "ALTER TABLE IF EXISTS encounters ALTER COLUMN practitioner_id DROP NOT NULL;"
            docker compose --env-file .env $COMPOSE_FILES pull
            docker compose --env-file .env $COMPOSE_FILES up -d --remove-orphans
            docker image prune -f
